name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock "pytest>=8"
          python -m pip install -e .

      # quality-fail-augment v2.0 은 별도 저장소라 CI 에 없다. 그 엔진이 필요한 통합
      # 테스트는 QUALITY_FAIL_ENGINE_ROOT 가 없으면 스스로 skip 하고, FAIL 경로 회귀
      # 테스트는 stub 엔진을 주입하므로 엔진 없이도 돈다.
      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
