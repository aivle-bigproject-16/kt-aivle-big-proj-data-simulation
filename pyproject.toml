[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-sim-dataset"
version = "1.2.0"
description = "JSON-only CT/RGB server simulation dataset pipeline"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
server-sim-dataset = "server_sim_dataset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

